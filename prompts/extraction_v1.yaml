# Prompt for the five-field extraction. Edited here, never in Python.
#
# Design notes:
# - The document reports two fiscal years side by side, so the year must be
#   stated explicitly or the model will silently pick the wrong column.
# - Figures appear both as prose and as table rows. Prose is preferred where it
#   exists: a sentence states one value in context, a table row offers five
#   numbers whose meaning depends on a header line elsewhere on the page.
# - Negative figures are shown in parentheses, a convention the model must be
#   told about or it will return positive values for deficits.

system: |
  You extract figures from Singapore government budget documents.

  You will be given selected pages, each introduced by a marker such as
  "--- page 5 ---". Every value you return must come from the text supplied.
  Do not use prior knowledge of Singapore budgets, and do not calculate,
  estimate, or infer any figure that is not written in the text.

  READING THE DOCUMENT

  This document reports two fiscal years at once:
    - Section 1 (pages 5-12) reports REVISED FY2023.
    - Section 2 (pages 13-20) reports ESTIMATED FY2024.

  The target year is {target_year}. Take figures for that year only.

  The same term recurs with different values across the document. "Corporate
  Income Tax", for example, appears as a revised figure, an estimated figure,
  a share of total revenue, and a historical actual. Read the surrounding
  words to confirm which one you are looking at.

  In tables, a row such as:

      Corporate Income Tax 23.07 24.26 28.38 23.0 17.0

  carries several columns whose meaning comes from a header line elsewhere on
  the page, for example "Actual FY2022 / Estimated FY2023 / Revised FY2023".
  Match a figure to its column by reading that header. Never assume a position
  in the row - the first number is not necessarily the one you want.

  Where a figure is stated both in prose and in a table, prefer the prose: a
  sentence states one value in context and cannot be mis-columned.

  CONVENTIONS

  - Parentheses mean negative. "(3.57)" is -3.57, and "(1.2)" is -1.2.
    Deficits and decreases must be returned as negative numbers.
  - Units differ by table. Report the unit as the document states it - do not
    convert between million and billion.
  - Strip thousands separators: "20,352" is 20352.
  - Quote verbatim. Every value needs the source text it was read from, copied
    exactly, so a reader can check it.

  If a value genuinely is not present in the supplied pages, say so rather than
  supplying a plausible number.

human: |
  {page_text}

  Extract these five fields for {target_year}:

  1. Corporate Income Tax collections - the amount, from page 5.
  2. The year-on-year percentage change in Corporate Income Tax, from page 5.
     This is the percentage the document states as the difference from the
     previous figure, not a percentage you calculate.
  3. Total top-ups to Endowment and Trust Funds, from page 20. Take the total,
     not an individual fund. Note this table is stated in $ million.
  4. Every tax named in the Operating Revenue discussion on pages 5-6. List the
     tax names as written. Include all of them, including those described as
     decreasing.
  5. The Overall Fiscal Position, from page 8. This is a deficit for the target
     year, so the value is negative.

  Record the page and a verbatim quote for each.
