# Non-secret settings. Credentials belong in .env (see .env.example).

# Source document. Downloaded once from this URL and cached under data/ using
# the filename from the URL, so later runs need no network. data/ is
# gitignored, so a fresh clone needs only this config.
pdf_url: https://isomer-user-content.by.gov.sg/153/20f8e128-58fa-44ea-a109-f2dec3995271/fy2024_analysis_of_revenue_and_expenditure.pdf

# Pages holding the target fields, 1-indexed as the document numbers them.
# Restricted deliberately: the same term carries different values elsewhere in
# the document (Corporate Income Tax appears on pp. 5, 8, 9, 16, 26, 27, 37),
# so narrowing the input removes the ambiguity.
pages: [5, 6, 8, 20]

# The page each field must be read from. These are injected into the prompt, so
# the page a field is bound to is defined here and nowhere else. A field whose
# value appears on another page is wrong even if it looks plausible - that
# distinction is what the prompt enforces.
field_pages:
  corporate_income_tax: 5
  corporate_income_tax_yoy: 5
  total_top_ups: 20
  operating_revenue_taxes: [5, 6]
  fiscal_position: 8

# Part 2: pages holding the dates to normalise.
# Page 1 is the title page (distribution date); page 36 is the glossary entry
# for Assets Taxes, which names the Estate Duty cut-off.
date_pages:
  distribution: 1     # title page
  estate_duty: 36     # glossary entry for Assets Taxes

# Part 2: the date every extracted date is classified against. Fixed rather than
# today's date, so 2024-02-16 stays Upcoming even though it has since passed -
# results do not drift as the real date moves.
reference_date: "2024-01-01"

# Part 3: the pages each specialist agent may read.
#
# Narrow by design, for the same reason as field_pages: an agent able to read
# the whole document will find a plausible figure on a page it was not asked
# about. Page 13 is scoped to revenue only - it carries both the revenue total
# and the top-ups sentence, so keeping it out of the expenditure set means
# neither agent can answer the combined query alone.
agent_pages:
  revenue: [9, 13, 15]        # revenue breakdown, FY2024 narrative, NIRC
  expenditure: [16, 18, 20]   # Table 2.1, top-ups prose, Table 2.4

# Hard cap on supervisor turns, so the graph provably terminates.
max_turns: 4

# Words that suggest a query is about spending rather than revenue. Used only
# when the model tries to synthesise before any agent has reported: the guard
# has to send it somewhere, and these decide which agent goes first. A miss
# costs a turn, not an answer - the other agent still runs before synthesis.
expenditure_hints:
  - fund
  - spend
  - expenditure
  - top-up
  - top up
  - transfer

# Ceiling on an agent's rendered prompt. An agent's pages are a few thousand
# characters and the whole document is ~59k, so a prompt approaching that means
# a page set above was widened by mistake - which multiplies the cost of every
# call without visibly changing the output. Asserted in the tests, so widening
# a page set fails loudly rather than quietly costing more.
prompt_character_budget: 12000

# Part 3: the reply when a query cannot be answered from the document at all.
# Fixed text rather than a model call - the model may well know the answer, and
# letting it reply would produce the ungrounded output the system prevents. It
# names what the document does cover, so a reader knows what to ask instead.
decline_message: >-
  This question cannot be answered from the document. It covers Singapore
  government revenue and expenditure for FY2024 - Operating Revenue and its
  components, Net Investment Returns Contribution, Total Expenditure, Special
  Transfers, and top-ups to Endowment and Trust Funds.

# Groq model provider
provider: groq
model: llama-3.1-8b-instant

# How many times the client retries a rate-limited request. Groq's free tier
# allows 6,000 tokens per minute, and one supervisor query is ~7k across six
# rapid calls, so the last can trip the limit. The client honours the server's
# retry-after header, so retries ride out the window rather than failing.
max_retries: 6

# 0 makes extraction deterministic: the model takes the most likely token each
# time, so the same pages yield the same figures. Raise it only to diagnose a
# model that refuses or returns malformed output at 0.
temperature: 0
